name: Release

# Chaine de release du parc, tenue par Actions (modele : ou-jouer #274).
# Sur chaque push de master :
#   1. release-please pose tag + release si une release PR vient d'etre fusionnee,
#      et tient la release PR a jour (version + changelog) ;
#   2. la release PR est fusionnee aussitot : regle du parc, elle suit toute
#      fusion d'une PR de travail ;
#   3. second passage de release-please, qui pose le tag de cette fusion : le
#      push fait avec GITHUB_TOKEN ne relance pas ce workflow ;
#   4. si une release est sortie et que le depot a `staging`, staging avance en
#      fast-forward sur le tag, puis les workflows qui ecoutent un push de staging
#      sont lances par workflow_dispatch (un push GITHUB_TOKEN ne les declenche pas).
# main (la prod) n'est pas ici : `release.sh --prod` depuis le laptop.
# Modele : chaine de release commune.
on:
  push:
    branches: [master]

permissions:
  contents: read

# Deux fusions rapprochees ne doivent pas publier deux fois la meme release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release PR et tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Lire, annuler et effacer les runs fantomes de la release PR.
      actions: write
    outputs:
      release_created: ${{ steps.rp2.outputs.release_created || steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp2.outputs.tag_name || steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Cherchee par son etiquette plutot que lue dans la sortie de l'etape
      # precedente : une release PR deja a jour n'y figure pas.
      - id: merge
        name: Fusionner la release PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              ...context.repo, state: 'open', base: 'master', per_page: 50 });
            const rel = prs.filter(p => p.labels.some(l => l.name === 'autorelease: pending'));
            if (rel.length === 0) { core.info('aucune release PR ouverte'); return; }
            // La release PR, ouverte par GITHUB_TOKEN, fait naitre des
            // runs `pull_request` (ci.yml, ponytail-review.yml, e2e.yml...) qui finissent
            // `action_required` sans aucun job (approbation qui ne vient pas), puis
            // `failure` a la fusion : croix rouge sur chaque release. On attend ces runs,
            // plafonne a 4 min : un run sans job est efface (annule d'abord s'il n'est
            // pas termine) ; un run avec des jobs reste, vert ou rouge, pour qu'un vrai
            // echec se voie. Runs cherches dans tout le depot : un depot sans ci.yml
            // rendrait un 404 qui bloquerait la release.
            const pause = ms => new Promise(r => setTimeout(r, ms));
            async function runsPr(sha) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, event: 'pull_request', head_sha: sha, per_page: 20 });
              return data.workflow_runs;
            }
            async function nbJobs(run) {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo, run_id: run.id, per_page: 1 });
              return data.total_count;
            }
            async function effacer(run, pourquoi) {
              core.notice(`run ${run.name} ${run.id} ${pourquoi} : efface`);
              try {
                await github.rest.actions.deleteWorkflowRun({ ...context.repo, run_id: run.id });
              } catch (e) { core.warning(`effacement du run ${run.id} impossible : ${e.message}`); }
            }
            async function solderRuns(sha) {
              let runs = [];
              let jobs = {};
              for (let t = 0; t < 24; t++) { // 24 x 10 s = 4 min au plus
                runs = await runsPr(sha);
                // Le run nait ~4 s apres l'ouverture : rien en 1 min, rien a attendre.
                if (runs.length === 0 && t >= 5) { core.info('aucun run pull_request pour cette release PR'); return; }
                jobs = {};
                for (const run of runs) jobs[run.id] = await nbJobs(run);
                // Fini d'attendre quand chaque run est termine ou a recu ses jobs.
                if (runs.length > 0 && runs.every(r => r.status === 'completed' || jobs[r.id] > 0)) break;
                await pause(10000);
              }
              for (const run of runs) {
                if (jobs[run.id] > 0) {
                  core.info(`run ${run.name} ${run.id} : ${jobs[run.id]} job(s), ${run.status} ${run.conclusion || ''}`);
                } else if (run.status === 'completed') {
                  if (run.conclusion === 'success' || run.conclusion === 'skipped') core.info(`run ${run.name} ${run.id} : ${run.conclusion}`);
                  else await effacer(run, `termine en ${run.conclusion} sans job`);
                } else {
                  try { await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id }); }
                  catch (e) { core.info(`annulation de ${run.id} : ${e.message}`); }
                  for (let t = 0; t < 12; t++) {
                    const { data: r } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: run.id });
                    if (r.status === 'completed') break;
                    await pause(5000);
                  }
                  await effacer(run, `toujours sans job apres 4 min (${run.status})`);
                }
              }
            }
            for (const pr of rel) {
              await solderRuns(pr.head.sha);
              // Une PR toute fraiche peut etre refusee le temps que GitHub calcule
              // sa fusionnabilite : quelques essais espaces.
              for (let i = 1; ; i++) {
                try {
                  await github.rest.pulls.merge({
                    ...context.repo, pull_number: pr.number, merge_method: 'squash' });
                  core.info(`release PR #${pr.number} fusionnee : ${pr.title}`);
                  break;
                } catch (e) {
                  if (i === 6) throw e;
                  core.info(`essai ${i} : ${e.message}`);
                  await pause(5000);
                }
              }
            }
            core.setOutput('merged', 'true');

      - id: rp2
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  staging:
    name: Avancer staging
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Jamais de force : staging pointe toujours sur un commit tague de la branche
      # de travail. Si elle porte autre chose, c'est une decision humaine.
      - id: ff
        name: Fast-forward de staging sur le tag
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          if ! git ls-remote --exit-code --heads origin staging >/dev/null; then
            echo "pas de branche staging : tag et changelog seulement."
            exit 0
          fi
          git fetch origin staging --tags
          sha=$(git rev-parse "$TAG^{commit}")
          if ! git merge-base --is-ancestor origin/staging "$sha"; then
            echo "::error::staging n'est pas un ancetre de $TAG : rien n'est force, a realigner a la main."
            exit 1
          fi
          git push origin "$sha:refs/heads/staging"
          echo "staging avance sur $TAG ($sha)"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Un workflow est relance s'il a un workflow_dispatch et une ligne
      # `branches:` qui cite staging (le push qu'il aurait recu).
      - name: Lancer les workflows de staging
        if: steps.ff.outputs.pushed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const dir = '.github/workflows';
            for (const f of fs.readdirSync(dir)) {
              if (!/\.ya?ml$/.test(f) || f.startsWith('release.')) continue;
              const t = fs.readFileSync(`${dir}/${f}`, 'utf8');
              if (!/workflow_dispatch/.test(t) || !/^\s*branches:.*\bstaging\b/m.test(t)) continue;
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: f, ref: 'staging' });
              core.info(`${f} lance sur staging`);
            }
